name: Collect TWSE

on:
  schedule:
    # 台灣時間 06:17（UTC 前一天 22:17）；避開整點降低 GitHub 排程延遲
    - cron: '17 22 * * 0-4'
  workflow_dispatch:

jobs:
  collect-twse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run TWSE collect
        env:
          FINMIND_TOKEN:        ${{ secrets.FINMIND_TOKEN }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          COLLECT_MODE:         twse
        run: node .github/scripts/collect_market_data.js
