name: Alpha 隨筆生成

on:
  workflow_run:
    workflows: ["Collect Alpha Report"]
    types: [completed]
  schedule:
    # 台灣時間週五 16:00（UTC 08:00）→ 週報
    - cron: '0 8 * * 5'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Agent 3 模式：auto（一般隨筆）/ weekly（強制產生週報，可用來補跑）'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - weekly

jobs:
  agent1:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name != 'workflow_run' }}
    steps:
      - name: Agent 1 — 市場資料員
        run: |
          echo "▶ Agent 1：抓市場資料 + 技術指標 + 市場環境感知"
          response=$(curl -s -w "\n%{http_code}" -X POST \
            "${{ secrets.VERCEL_API_URL }}/api/news?endpoint=alpha_agent1" \
            -H "x-owner-token: ${{ secrets.OWNER_TOKEN }}" \
            -H "Content-Type: application/json")
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "$body" | jq . || echo "$body"
          if [ "$http_code" != "200" ]; then
            echo "❌ Agent 1 失敗：HTTP $http_code"
            exit 1
          fi
          if echo "$body" | jq -e 'has("error")' > /dev/null 2>&1; then
            echo "❌ Agent 1 回應含有 error 欄位"
            exit 1
          fi
          echo "✅ Agent 1 完成"

  agent2:
    runs-on: ubuntu-latest
    needs: agent1
    if: success()
    steps:
      - name: Agent 2 — 分析師
        run: |
          echo "▶ Agent 2：評分昨日預測 + 弱點分析 + 生成檢討篇"
          response=$(curl -s -w "\n%{http_code}" -X POST \
            "${{ secrets.VERCEL_API_URL }}/api/news?endpoint=alpha_agent2" \
            -H "x-owner-token: ${{ secrets.OWNER_TOKEN }}" \
            -H "Content-Type: application/json")
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "$body" | jq . || echo "$body"
          if [ "$http_code" != "200" ]; then
            echo "❌ Agent 2 失敗：HTTP $http_code"
            exit 1
          fi
          if echo "$body" | jq -e 'has("error")' > /dev/null 2>&1; then
            echo "❌ Agent 2 回應含有 error 欄位"
            exit 1
          fi
          echo "✅ Agent 2 完成"

  agent3:
    runs-on: ubuntu-latest
    needs: [agent1, agent2]
    if: success()
    steps:
      - name: Agent 3 — 撰稿員
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_MODE: ${{ github.event.inputs.mode }}
        run: |
          HOUR=$(date -u +%H)
          echo "UTC 現在：${HOUR}:00（觸發來源：${EVENT_NAME}）"
          # 週報改依「觸發來源」判斷：schedule 事件只會由週五 cron 觸發，
          # 不受 GitHub 排程延遲影響（舊版用 UTC 小時 = 08 判斷，延遲超過一小時就會漏掉）
          if [ "$EVENT_NAME" = "schedule" ] || [ "$DISPATCH_MODE" = "weekly" ]; then
            echo "週報觸發 → weekly_recap"
            endpoint="weekly_recap"
          else
            echo "→ 觸發 Alpha 隨筆"
            endpoint="alpha_thought"
          fi

          response=$(curl -s -w "\n%{http_code}" -X POST \
            "${{ secrets.VERCEL_API_URL }}/api/news?endpoint=${endpoint}" \
            -H "x-owner-token: ${{ secrets.OWNER_TOKEN }}" \
            -H "Content-Type: application/json")
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "$body" | jq . || echo "$body"
          if [ "$http_code" != "200" ]; then
            echo "❌ Agent 3（${endpoint}）失敗：HTTP $http_code"
            exit 1
          fi
          if echo "$body" | jq -e 'has("error")' > /dev/null 2>&1; then
            echo "❌ Agent 3（${endpoint}）回應含有 error 欄位"
            exit 1
          fi
          echo "✅ Agent 3（${endpoint}）完成"
