name: Alpha 隨筆生成

on:
  workflow_run:
    workflows: ["Collect Alpha Report"]
    types: [completed]
  schedule:
    # 台灣時間週五 16:00（UTC 08:00）→ 週報
    - cron: '0 8 * * 5'
  workflow_dispatch:

jobs:
  agent1:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name != 'workflow_run' }}
    steps:
      - name: Agent 1 — 市場資料員
        run: |
          echo "▶ Agent 1：抓市場資料 + 技術指標 + 市場環境感知"
          curl -s -X POST \
            "${{ secrets.VERCEL_API_URL }}/api/news?endpoint=alpha_agent1" \
            -H "x-owner-token: ${{ secrets.OWNER_TOKEN }}" \
            -H "Content-Type: application/json" \
            | jq .

  agent2:
    runs-on: ubuntu-latest
    needs: agent1
    if: success()
    steps:
      - name: Agent 2 — 分析師
        run: |
          echo "▶ Agent 2：評分昨日預測 + 弱點分析 + 生成檢討篇"
          curl -s -X POST \
            "${{ secrets.VERCEL_API_URL }}/api/news?endpoint=alpha_agent2" \
            -H "x-owner-token: ${{ secrets.OWNER_TOKEN }}" \
            -H "Content-Type: application/json" \
            | jq .

  agent3:
    runs-on: ubuntu-latest
    needs: [agent1, agent2]
    if: success()
    steps:
      - name: Agent 3 — 撰稿員
        run: |
          HOUR=$(date -u +%H)
          echo "UTC 現在：${HOUR}:00"

          if [ "$HOUR" = "08" ]; then
            echo "週五 16:00 → 觸發週報"
            curl -s -X POST \
              "${{ secrets.VERCEL_API_URL }}/api/news?endpoint=weekly_recap" \
              -H "x-owner-token: ${{ secrets.OWNER_TOKEN }}" \
              -H "Content-Type: application/json" \
              | jq .
          else
            echo "→ 觸發 Alpha 隨筆"
            curl -s -X POST \
              "${{ secrets.VERCEL_API_URL }}/api/news?endpoint=alpha_thought" \
              -H "x-owner-token: ${{ secrets.OWNER_TOKEN }}" \
              -H "Content-Type: application/json" \
              | jq .
          fi
